[package]
name = "xi-recomp"
version = "0.1.0"
description = "FFXiMain.dll/FFXi.dll static recompiler (x86 -> C): prepare and translate a game install without Python"
edition = "2021"
publish = false

[lib]
name = "xi_recomp"
path = "src/lib.rs"

[[bin]]
name = "xi-recomp"
path = "src/main.rs"

[dependencies]
# capstone 5.0.6 (the Python pipeline uses 5.0.7: its X86 sources are identical, see disasm.rs)
capstone-sys = { version = "0.18", default-features = false, features = ["full", "arch_x86"] }
indexmap = "2"
rayon = "1"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
