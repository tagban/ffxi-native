[package]
name = "ffxi-launcher"
version = "0.1.4"
description = "Signs in and runs the recompiled FINAL FANTASY XI (host64)"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# making accounts on a LandSandBoat server (account.rs): its login port's TLS, as xi-vault speaks it
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
# game versions: the public server side (update server, publisher, updater, protocol)
xi-vault = { git = "https://github.com/tagban/ffxi-update-server", branch = "main" }
xi-recomp = { path = "../../recomp-rs" }
ureq = { version = "2", features = ["json"] }
tar = "0.4"
xz2 = { version = "0.1", features = ["static"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
